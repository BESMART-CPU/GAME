<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ദീപിക ഗ്രാൻപ്രി ക്വിസ്</title>
<style>
:root{--bg:#f4f4f6;--fg:#15151e;--card:#fff;--mut:#62626f;--acc:#e10600;--gold:#f2a900;--ok:#0b7a3b;--bad:#c62828;--bd:#dcdce4}
@media (prefers-color-scheme:dark){:root{--bg:#101018;--fg:#f2f2f6;--card:#1b1b27;--mut:#b0b0bf;--acc:#ff4d45;--gold:#ffc83d;--ok:#3ddc84;--bad:#ff6b6b;--bd:#33334a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Malayalam","Manjari",system-ui,sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:.2em 0;color:var(--acc)}
.sub{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.track{position:relative;height:34px;background:#2b2b36;border-radius:10px;margin-bottom:6px;overflow:hidden}
.track:after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/7px 7px}
.car{position:absolute;top:2px;font-size:26px;transition:left .5s ease;left:0}
.tm{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:12px}
.tm i{display:block;height:100%;background:var(--gold);width:100%}
.q{font-size:1.15rem;font-weight:700;margin:0 0 12px}
.o{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--acc)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.o.gone{opacity:.25;pointer-events:none}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.l{background:var(--gold);color:#15151e;padding:8px 14px}
.btn:disabled{opacity:.4}
.msg{font-size:1.2rem;font-weight:800;text-align:center;min-height:2em}
.c{text-align:center}.big{font-size:2.6rem;font-weight:800;color:var(--acc)}
table{width:100%;border-collapse:collapse;margin:10px 0}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
tr.me{background:color-mix(in srgb,var(--gold) 30%,var(--card));font-weight:800}
input{font:inherit;width:100%;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);margin:6px 0 12px}
ol{padding-left:22px;margin:6px 0 14px}
.prize{border:2px solid var(--gold);border-radius:12px;padding:10px;margin:0 0 12px;background:color-mix(in srgb,var(--gold) 14%,var(--card))}
.shot{border:2px dashed var(--acc);border-radius:12px;padding:10px;margin:12px 0}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const Q=[
["മെർക്കുറി അടങ്ങിയ ഫെയർനെസ് ക്രീമുകൾ ഏത് അവയവങ്ങളുടെ പ്രവർത്തനത്തെ തകരാറിലാക്കുന്നു എന്നാണു മുന്നറിയിപ്പ്?",["വൃക്കകൾ","ശ്വാസകോശം","കണ്ണുകൾ","ആമാശയം"],0],
["ഫെയർനെസ് ക്രീം ഉപയോഗിച്ച 17-കാരിക്കു ഗുരുതര വൃക്കരോഗം സ്ഥിരീകരിച്ച ജില്ല?",["മലപ്പുറം","കോഴിക്കോട്","തൃശൂർ","കണ്ണൂർ"],0],
["വ്യാജ സൗന്ദര്യവർധക ഉൽപന്നങ്ങൾക്കെതിരെ ഡ്രഗ്സ് കൺട്രോൾ വിഭാഗം നടത്തുന്ന പരിശോധനയുടെ പേര്?",["ഓപ്പറേഷൻ സൗന്ദര്യ","ഓപ്പറേഷൻ മൺസൂൺ","ഓപ്പറേഷൻ ഡി-ഹണ്ട്","ഓപ്പറേഷൻ ഗരുഡ"],0],
["പമ്പാനദിയിൽ വസ്ത്രങ്ങളും മാലിന്യങ്ങളും തള്ളിയാൽ എത്ര രൂപ പിഴ?",["₹1,000","₹2,000","₹5,000","₹10,000"],2],
["ഇന്നു കൂദാശ നടക്കുന്ന പാറേൽ മർത്ത്മറിയം ബസിലിക്കയിലെ പള്ളി?",["അമലോത്ഭവമാതാ പള്ളി","വിമലഹൃദയ പള്ളി","സെന്റ് ജോസഫ് പള്ളി","ഫാത്തിമ മാതാ പള്ളി"],0],
["വെല്ലിംഗ്ടൺ ടെസ്റ്റിൽ ഇന്ത്യ ഒന്നാം ഇന്നിങ്സിൽ ഡിക്ലയർ ചെയ്ത സ്കോർ?",["620/9","680/9","720/9","750/9"],2],
["ഇന്ത്യയ്ക്കായി 153 പന്തിൽ 128 റൺസ് നേടിയ വിക്കറ്റ് കീപ്പർ?",["ഋഷഭ് പന്ത്","ധ്രുവ് ജുറെൽ","കെ.എൽ. രാഹുൽ","സഞ്ജു സാംസൺ"],0],
["പന്തിനൊപ്പം തകർത്തടിച്ച് 78 റൺസ് നേടിയ ഇന്ത്യൻ താരം?",["ധ്രുവ് ജുറെൽ","ദേവ്ദത്ത് പടിക്കൽ","ആകാശ് ദീപ്","അൻഷുൽ കാംബോജ്"],0],
["720/9 എന്ന സ്കോറിനു മുമ്പ് വിദേശത്ത് ഇന്ത്യയുടെ ഏറ്റവും ഉയർന്ന ടീം ടോട്ടൽ (2010-ൽ ശ്രീലങ്കയ്ക്കെതിരെ)?",["607","657","707","757"],2],
["രണ്ടാം ഇന്നിങ്സിൽ ന്യൂസിലൻഡ് ക്യാപ്റ്റൻ ടോം ലാഥമിനെ പൂജ്യത്തിനു പുറത്താക്കിയ ഇന്ത്യൻ പേസർ?",["ജസ്പ്രീത് ബുംറ","മുഹമ്മദ് സിറാജ്","ആകാശ് ദീപ്","പ്രസിദ്ധ് കൃഷ്ണ"],0],
["ലാസ് വേഗാസ് ഫോർമുല വൺ ഗ്രാൻപ്രി വിജയി?",["മാക്സ് വെർസ്റ്റപ്പൻ","ലാൻഡോ നോറിസ്","ലൂയിസ് ഹാമിൽട്ടൺ","ഓസ്കർ പിയാസ്ട്രി"],0],
["2026 ഫോർമുല വൺ ഡ്രൈവേഴ്സ് ചാംപ്യൻഷിപ്പ് നേരത്തേ സ്വന്തമാക്കിയ താരം?",["കിമി അന്റോനെല്ലി","മാക്സ് വെർസ്റ്റപ്പൻ","ലാൻഡോ നോറിസ്","ചാൾസ് ലെക്ലെർക്"],0],
["ന്യൂസിലൻഡിനെതിരായ മൂന്നു മത്സര പുരുഷ ഹോക്കി പരമ്പര ഇന്ത്യ നേടിയ മാർജിൻ?",["1-0","2-0","2-1","3-0"],0],
["സയ്യിദ് മുഷ്താഖ് അലി ട്രോഫിയിൽ പോണ്ടിച്ചേരിക്കെതിരെ 39 റൺസിന് 4 വിക്കറ്റ് നേടിയ കേരള പേസർ?",["എം.ഡി. നിധീഷ്","ബേസിൽ തമ്പി","അഖിൽ സ്കറിയ","എൻ.പി. ബേസിൽ"],0],
["എംഎൽഎസ് പ്ലേ ഓഫിൽ ലയണൽ മെസിയുടെ ഇന്റർ മയാമിയെ 3-0നു തോൽപിച്ച ടീം?",["കൊളംബസ് ക്രൂ","ഇന്റർ കൊളംബസ്","ലോസ് ഏഞ്ചലസ് എഫ്സി","സിയാറ്റിൽ സൗണ്ടേഴ്സ്"],0]];
const T=20,PEN=10,N=Q.length,app=document.getElementById("app");
const RIV=[["ബ്ലൂ ബോൾട്ട്",85],["റെഡ് റോക്കറ്റ്",110],["ഗ്രീൻ ഗസൽ",135],["ഗോൾഡ് ഗോസ്റ്റ്",170],["സിൽവർ സ്റ്റോം",210]];
let i,total,wrong,ok_,left,t0,tm,lock,u50,name="",order=[];
const sh=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
const f1=s=>s.toFixed(1)+" സെ";
function home(){
 app.innerHTML=`<div class="c" style="padding-top:12px"><div style="font-size:52px">🏎️🏁</div>
 <h1>ദീപിക ഗ്രാൻപ്രി ക്വിസ്</h1>
 <p class="sub">ദീപിക ഡിഎഫ്സി പാലാ അവതരിപ്പിക്കുന്നത് · 2026 നവംബർ 23-ലെ ദീപിക പത്രത്തെ ആധാരമാക്കി</p></div>
 <div class="prize"><b>🎁 സമ്മാനം:</b> രാവിലെ <b>10.30 വരെ</b> കളിച്ചു ജയിച്ച് ഫല സ്ക്രീനിന്റെ സ്ക്രീൻഷോട്ട് <b>8113831492</b> എന്ന നമ്പറിൽ അയയ്ക്കുന്നവർക്കാണു സമ്മാനം. ഒന്നിലധികം വിജയികൾ ഉണ്ടെങ്കിൽ നറുക്കെടുപ്പിലൂടെ സമ്മാന ജേതാവിനെ തിരഞ്ഞെടുക്കും.</div>
 <div class="card"><p style="font-weight:700;margin:0">നിർദേശങ്ങൾ</p>
 <ol><li>ദീപിക വരിക്കാർക്കു മാത്രമേ മത്സരത്തിൽ പങ്കെടുക്കാൻ പാടുള്ളൂ.</li>
 <li>15 ചോദ്യങ്ങൾ = 15 ലാപ്പുകൾ. ഓരോ ലാപ്പിലും നിങ്ങൾ ഉത്തരം പറയാനെടുക്കുന്ന സമയം റേസ് സമയത്തിൽ ചേരും.</li>
 <li>തെറ്റായ ഉത്തരത്തിനോ സമയം തീർന്നാലോ ${PEN} സെക്കൻഡ് പിറ്റ്‌സ്റ്റോപ് പെനാൽറ്റി ചേരും. ഓരോ ചോദ്യത്തിനും ${T} സെക്കൻഡ്.</li>
 <li>ഏറ്റവും കുറഞ്ഞ ആകെ റേസ് സമയമാണ് ജയം. പോഡിയം (ആദ്യ 3 സ്ഥാനം) നേടിയാൽ "ജയിച്ചു".</li>
 <li>ഒരു തവണ "DRS 50:50" സഹായം ഉപയോഗിക്കാം.</li>
 <li>ജയിച്ചവർ ഫല സ്ക്രീനിന്റെ സ്ക്രീൻഷോട്ട് എടുത്ത് <b>8113831492</b> എന്ന നമ്പറിൽ <b>രാവിലെ 10.30-നകം</b> അയയ്ക്കണം.</li></ol>
 <label>നിങ്ങളുടെ പേര്</label><input id="nm" placeholder="പേര് ടൈപ്പ് ചെയ്യുക" maxlength="40">
 <div class="c"><button class="btn" id="go">റേസ് തുടങ്ങാം</button></div></div>`;
 document.getElementById("go").onclick=()=>{name=document.getElementById("nm").value.trim();start()};
}
function start(){i=0;total=0;wrong=0;ok_=0;u50=false;order=sh(Q.map((_,n)=>n));show()}
function show(){
 const [q,o,a]=Q[order[i]],ans=o[a],opts=sh(o);lock=false;left=T;t0=Date.now();
 app.innerHTML=`<div class="bar"><span>ലാപ് ${i+1}/${N}</span><span>⏱ ${f1(total)}</span><span>പെനാൽറ്റി ${wrong}</span><span id="sec">${T}</span></div>
 <div class="track"><span class="car" style="left:${i/N*88}%">🏎️</span></div>
 <div class="tm"><i id="t"></i></div>
 <div class="card"><p class="q">${q}</p><div id="os"></div>
 <button class="btn l" id="ff" ${u50?"disabled":""}>DRS 50:50</button></div>
 <div class="msg" id="m"></div><div class="c" id="nx"></div>`;
 const os=document.getElementById("os");
 opts.forEach(x=>{const b=document.createElement("button");b.className="o";b.textContent=x;b.onclick=()=>pick(b,x,ans);os.appendChild(b)});
 document.getElementById("ff").onclick=e=>{if(lock||u50)return;u50=true;e.target.disabled=true;
  sh([...os.children].filter(b=>b.textContent!==ans)).slice(0,2).forEach(b=>b.classList.add("gone"))};
 clearInterval(tm);tick();tm=setInterval(()=>{left--;tick();if(left<=0)pick(null,null,ans)},1000);
}
function tick(){const s=document.getElementById("sec"),t=document.getElementById("t");
 if(s)s.textContent=Math.max(left,0);if(t)t.style.width=Math.max(0,left/T*100)+"%"}
function pick(btn,x,ans){
 if(lock)return;lock=true;clearInterval(tm);
 const ok=x===ans,m=document.getElementById("m");
 const el=Math.min(T,(Date.now()-t0)/1000);
 document.querySelectorAll(".o").forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add("ok")});
 document.getElementById("ff").disabled=true;
 if(btn&&!ok)btn.classList.add("no");
 let lap=el;
 if(ok){ok_++;m.innerHTML=`<span style="color:var(--ok)">✅ ശരി! ലാപ് സമയം ${f1(lap)}</span>`}
 else{wrong++;lap+=PEN;m.innerHTML=`<span style="color:var(--bad)">🛞 പിറ്റ്‌സ്റ്റോപ്! ${f1(el)} + ${PEN} സെ പെനാൽറ്റി</span>`}
 total+=lap;
 const car=document.querySelector(".car");if(car)car.style.left=((i+1)/N*88)+"%";
 const n=document.getElementById("nx"),last=i+1>=N;
 n.innerHTML=`<button class="btn">${last?"ചെക്കേഡ് ഫ്ലാഗ് 🏁":"അടുത്ത ലാപ് ➜"}</button>`;
 n.firstChild.onclick=()=>{i++;last?end():show()};
}
function end(){
 const nm=(name||"നിങ്ങൾ").replace(/[<>&]/g,"");
 const rows=RIV.map(r=>({n:r[0],p:r[1],me:false}));rows.push({n:nm,p:total,me:true});
 rows.sort((a,b)=>a.p-b.p);
 const pos=rows.findIndex(r=>r.me)+1,win=pos<=3;
 const r=pos===1?"🏆 പോൾ വിജയി! ചാമ്പ്യൻ!":pos===2?"🥈 രണ്ടാം സ്ഥാനം, പോഡിയം!":pos===3?"🥉 മൂന്നാം സ്ഥാനം, പോഡിയം!":"📰 പോഡിയം നഷ്ടമായി, നാളെ വീണ്ടും ശ്രമിക്കൂ";
 app.innerHTML=`<div class="card c"><div style="font-size:48px">🏁</div><h1>${win?"ജയിച്ചു! പോഡിയം ഫിനിഷ്":"റേസ് അവസാനിച്ചു"}</h1>
 <div class="big">P${pos}</div><p>ആകെ റേസ് സമയം ${f1(total)} · ശരി ${ok_}/${N} · പെനാൽറ്റി ${wrong}</p>
 <p style="font-size:1.2rem;font-weight:700">${r}</p>
